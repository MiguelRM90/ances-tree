<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />

    <title>AncesTree — Local-First Family Tree</title>
    <meta
      name="description"
      content="Build and preserve your family's genealogical archive directly in the browser. Zero backend, zero accounts, zero runtime dependencies."
    />
    <meta property="og:title" content="AncesTree — A family tree you keep yourself" />
    <meta
      property="og:description"
      content="Local-first genealogy PWA with zero runtime dependencies, custom streaming ZIP & GEDCOM 5.5.1 engines, and dual File System Access + OPFS storage."
    />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Installed to the home screen, iOS stops treating the site as an ordinary
      tab — which is also what exempts its storage from being discarded after a
      week of not visiting. On a phone the archive lives in browser storage
      (storage.md), so this is not decoration; it is what keeps the data.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AncesTree" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>AncesTree requires JavaScript.</noscript>
  </body>
</html>
